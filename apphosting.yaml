# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Scale to zero when there is no traffic to stay within free tier limits
  minInstances: 0
  # Limit to 1 instance to prevent unexpected costs
  maxInstances: 1
  # Default memory for the instance
  memory: 512MiB
